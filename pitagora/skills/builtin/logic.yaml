name: Formal Logic
domain: Philosophy
description: >
  Formal logic: truth tables, natural deduction, and predicate calculus.
  Covers propositional connectives, inference rules (modus ponens, modus
  tollens, hypothetical syllogism), and quantifiers with exercises at three
  levels.
concepts:
  - Truth tables for propositional connectives
  - Natural deduction (modus ponens, modus tollens, hypothetical syllogism)
  - Predicate calculus and quantifiers
common_mistakes:
  - Affirming the consequent (from P→Q and Q, inferring P) — a fallacy, not modus ponens.
  - Denying the antecedent (from P→Q and ¬P, inferring ¬Q) — a fallacy, not modus tollens.
  - Confusing ∀x∃y P(x,y) with ∃y∀x P(x,y) — quantifier order matters.
  - Treating material implication (P→Q) as causal or temporal implication.
analogies:
  - A truth table is a complete enumeration of every possible world for the atoms.
  - Natural deduction is a game where each move (inference rule) must be legal; the proof is the legal game record.
  - ∀ is a conjunction over the whole domain; ∃ is a disjunction over the whole domain.
socratic_questions:
  - If P→Q is true and Q is true, what can you say about P? Why not more?
  - Is ¬(P∧Q) the same as ¬P∨¬Q? Prove it with a truth table.
  - What is the difference between "for every x there is a y" and "there is a y for every x"?
verification_strategies:
  - Build the full truth table and check the relevant column.
  - For a deduction, justify each line with the rule and the line numbers it cites.
  - For a quantified claim, test it on a small finite domain by enumeration.
exercises:
  - level: beginner
    prompt: |
      Build the truth table for (P ∧ Q) → ¬R. For which rows is it false?
    hint: The implication is false only when the antecedent is true and the consequent is false.
    solution: |
      (P ∧ Q) → ¬R is false exactly when P=T, Q=T, R=T (so ¬R=F and the antecedent is T).
      Every other row yields true.
  - level: beginner
    prompt: |
      Using modus ponens, derive the conclusion from:
        1. P → Q
        2. Q → R
        3. P
      Show each step and the rule applied.
    hint: Apply modus ponens twice; you can also chain via hypothetical syllogism.
    solution: |
      From (1) and (3) by modus ponens: Q.
      From (2) and Q by modus ponens: R.
  - level: intermediate
    prompt: |
      Show that ¬(P → Q) is logically equivalent to P ∧ ¬Q using a truth table.
    hint: P → Q is false only when P is true and Q is false.
    solution: |
      P → Q is false exactly on the row P=T, Q=F. On that row P ∧ ¬Q is true,
      and on every other row both are false. The two columns match, so the
      formulas are equivalent.
  - level: intermediate
    prompt: |
      Prove that from ∀x (P(x) → Q(x)) and ∃x P(x) you can derive ∃x Q(x).
      Name each inference rule you use.
    hint: Use existential instantiation then modus ponens, then existential generalization.
    solution: |
      Let a be a witness such that P(a) holds (existential instantiation).
      From ∀x (P(x) → Q(x)) get P(a) → Q(a) (universal instantiation).
      From P(a) and P(a) → Q(a) get Q(a) (modus ponens).
      From Q(a) conclude ∃x Q(x) (existential generalization).
  - level: advanced
    prompt: |
      Is ∀x ∃y R(x,y) equivalent to ∃y ∀x R(x,y)? If not, give a model where they differ.
    hint: Think about a relation where each x has its own y, but no single y works for every x.
    solution: |
      They are not equivalent. Let the domain be ℕ and R(x,y) mean y = x+1.
      Then ∀x ∃y R(x,y) is true (each x has a successor), but
      ∃y ∀x R(x,y) is false (no single y is the successor of every x).
      The second statement implies the first, but not conversely.
  - level: advanced
    prompt: |
      Give a natural deduction proof of ¬P from P → Q, Q → R, and ¬R.
      Use only standard inference rules.
    hint: Combine modus tollens twice.
    solution: |
      From (2) Q → R and (3) ¬R, by modus tollens: ¬Q.
      From (1) P → Q and ¬Q, by modus tollens: ¬P.

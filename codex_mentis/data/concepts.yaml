    name: Metric Spaces
    prerequisites: [calc_limits]
  - id: top_topological_spaces
    name: Topological Spaces
    prerequisites: [top_metric_spaces]
  - id: top_compactness
    name: Compactness
    prerequisites: [top_topological_spaces]
  - id: top_connectedness
    name: Connectedness
    prerequisites: [top_topological_spaces]
  - id: top_homotopy
    name: Homotopy
    prerequisites: [top_topological_spaces]


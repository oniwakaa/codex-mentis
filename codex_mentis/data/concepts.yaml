    prerequisites: [thermo_laws]
  - id: thermo_ensembles
    name: Statistical Ensembles
    prerequisites: [thermo_entropy]
  - id: thermo_partition
    name: Partition Function
    prerequisites: [thermo_ensembles]
  - id: thermo_phase_transitions
    name: Phase Transitions
    prerequisites: [thermo_partition]

topology:

algebra:
  - id: alg_groups
    name: Groups
    prerequisites: []
  - id: alg_rings
    name: Rings
    prerequisites: [alg_groups]
  - id: alg_fields
    name: Fields
    prerequisites: [alg_rings]
  - id: alg_vector_spaces
    name: Vector Spaces
    prerequisites: [alg_fields]
  - id: alg_galois
    name: Galois Theory
    prerequisites: [alg_fields, alg_groups]

calculus:
  - id: calc_limits
    name: Limits
    prerequisites: []
  - id: calc_derivatives
    name: Derivatives
    prerequisites: [calc_limits]
  - id: calc_integrals
    name: Integrals
    prerequisites: [calc_derivatives]
  - id: calc_sequences_series
    name: Sequences and Series
    prerequisites: [calc_limits]
  - id: calc_multivariable
    name: Multivariable Calculus
    prerequisites: [calc_derivatives, calc_integrals]

linear_algebra:
  - id: la_matrices
    name: Matrices
    prerequisites: []
  - id: la_determinants
    name: Determinants
    prerequisites: [la_matrices]
  - id: la_transformations
    name: Linear Transformations
    prerequisites: [la_matrices]
  - id: la_eigenvalues
    name: Eigenvalues and Eigenvectors
    prerequisites: [la_transformations]
  - id: la_inner_product
    name: Inner Product Spaces
    prerequisites: [la_transformations, alg_vector_spaces]

mechanics:
  - id: mech_kinematics
    name: Kinematics
    prerequisites: []
  - id: mech_newtons_laws
    name: Newton's Laws
    prerequisites: [mech_kinematics, calc_derivatives]
  - id: mech_central_forces
    name: Central Forces
    prerequisites: [mech_newtons_laws, calc_integrals]
  - id: mech_lagrangian

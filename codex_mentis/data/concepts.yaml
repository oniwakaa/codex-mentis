    prerequisites: [calc_multivariable]
  - id: em_magnetostatics
    name: Magnetostatics
    prerequisites: [calc_multivariable]
  - id: em_maxwells_equations
    name: Maxwell's Equations
    prerequisites: [em_electrostatics, em_magnetostatics]

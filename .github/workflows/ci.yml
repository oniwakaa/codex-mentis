name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff
        run: uv run ruff check pitagora/ tests/

      - name: Black
        run: uv run black --check pitagora/ tests/

      - name: Mypy
        run: uv run mypy pitagora/ --ignore-missing-imports
        continue-on-error: true

      - name: Pytest
        run: uv run pytest -q

      - name: Build
        run: uv build

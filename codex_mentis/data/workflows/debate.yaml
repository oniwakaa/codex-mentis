# Debate Workflow
# Two agents argue opposing sides, a synthesizer reconciles
name: debate
description: >
  Structured debate between Prover (argues FOR) and Reviewer (argues AGAINST).
  Multiple rounds of cross-examination, with a Synthesizer producing the verdict.

inputs:
  - name: claim
    description: The claim or proposition to debate
    required: true
  - name: rounds
    description: Number of debate rounds
    default: 3

steps:
  - id: opening_pro
    agent: prover
    prompt: |
      You are arguing IN FAVOR of the following claim:
      "{{ claim }}"
      
      Present your strongest opening argument. Use mathematical evidence,
      citations, and formal reasoning. This is a DEBATE — be persuasive
      but rigorous.
    outputs: [pro_argument]

  - id: opening_con
    agent: reviewer
    prompt: |
      You are arguing AGAINST the following claim:
      "{{ claim }}"
      
      Present your strongest opening argument. Search for counterexamples,
      edge cases, and logical flaws. Use mathematical evidence.
      This is a DEBATE — be rigorous and find weaknesses.
    tools: [sympy_evaluate]
    outputs: [con_argument]

  - id: cross_exam_pro
    agent: prover
    prompt: |
      Your opponent argued:
      {{ opening_con.outputs.con_argument }}
      
      Cross-examine their argument. Identify logical fallacies,
      challenge their evidence, and defend your position.
      Claim being debated: "{{ claim }}"
    inputs_from: [opening_con]
    outputs: [pro_cross_exam]

  - id: cross_exam_con
    agent: reviewer
    prompt: |
      Your opponent argued:
      {{ opening_pro.outputs.pro_argument }}
      
      Cross-examine their argument. Find mathematical errors,
      challenge assumptions, and strengthen your counter-position.
      Claim being debated: "{{ claim }}"
    inputs_from: [opening_pro]
    tools: [sympy_evaluate]
    outputs: [con_cross_exam]

  - id: rebuttal_pro
    agent: prover
    prompt: |
      Respond to the cross-examination:
      {{ cross_exam_con.outputs.con_cross_exam }}
      
      Defend against challenges and strengthen your case.
    inputs_from: [cross_exam_con]
    outputs: [pro_rebuttal]

  - id: rebuttal_con
    agent: reviewer
    prompt: |
      Respond to the cross-examination:
      {{ cross_exam_pro.outputs.pro_cross_exam }}
      
      Address the challenges and reinforce your counter-arguments.
    inputs_from: [cross_exam_pro]
    tools: [sympy_evaluate]
    outputs: [con_rebuttal]

  - id: synthesis
    agent: tutor
    prompt: |
      You are the neutral judge of a formal debate.
      
      CLAIM: "{{ claim }}"
      
      ARGUMENTS FOR:
      Opening: {{ opening_pro.outputs.pro_argument }}
      Cross-exam: {{ cross_exam_pro.outputs.pro_cross_exam }}
      Rebuttal: {{ rebuttal_pro.outputs.pro_rebuttal }}
      
      ARGUMENTS AGAINST:
      Opening: {{ opening_con.outputs.con_argument }}
      Cross-exam: {{ cross_exam_con.outputs.con_cross_exam }}
      Rebuttal: {{ rebuttal_con.outputs.con_rebuttal }}
      
      Synthesize both sides. Identify the strongest arguments from each.
      Give a balanced verdict with a confidence score.
      What is the truth? Is the claim fully correct, partially correct, or false?
    inputs_from: [opening_pro, opening_con, cross_exam_pro, cross_exam_con, rebuttal_pro, rebuttal_con]
    outputs: [verdict, confidence, synthesis]

merge_strategy: last
